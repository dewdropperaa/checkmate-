# Launch overlay — use with production Compose on the API VPS:
#
#   docker compose -f docker-compose.yml -f docker-compose.launch.yml up -d --build
#
# Binds the API to loopback only. Terminate TLS on the host (Caddy/nginx +
# Cloudflare Origin CA) and reverse-proxy to http://127.0.0.1:8000.
# See docs/LAUNCH.md and terraform/cloudflare/origin-lock/.

services:
  backend:
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://127.0.0.1:8000/health | grep -q "\"status\":\"ok\"" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
