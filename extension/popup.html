<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel Scan</title>
    <style>
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        margin: 0;
        width: 360px;
        background: #f8fafc;
        color: #0f172a;
      }
      .container {
        padding: 16px;
      }
      h1 {
        margin: 0;
        font-size: 1.05rem;
      }
      .hint {
        margin: 6px 0 12px;
        font-size: 0.78rem;
        color: #475569;
      }
      .label {
        margin: 0 0 6px;
        font-size: 0.75rem;
        color: #64748b;
      }
      .url-box {
        margin: 0 0 12px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        font-size: 0.76rem;
        line-height: 1.3;
        max-height: 58px;
        overflow: auto;
        word-break: break-all;
      }
      button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 8px;
        border: none;
        padding: 10px 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #scan-btn {
        background: #1d4ed8;
        color: #ffffff;
        margin-bottom: 12px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #scan-status {
        margin: 0 0 10px;
        font-size: 0.82rem;
        color: #334155;
      }
      .muted {
        color: #64748b;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 3px 0;
        font-size: 0.8rem;
      }
      .severity-list {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
      }
      .severity-list li {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        margin: 3px 0;
      }
      #report-btn {
        background: #0f172a;
        color: #ffffff;
        margin-top: 10px;
      }
      #open-options {
        margin-top: 10px;
        background: transparent;
        color: #1d4ed8;
        border: 1px solid #93c5fd;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }
      .modal {
        width: 100%;
        background: #ffffff;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        padding: 14px;
      }
      .modal h2 {
        margin: 0 0 10px;
        font-size: 0.94rem;
      }
      .modal p {
        margin: 0;
        font-size: 0.8rem;
        color: #334155;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      #reject-btn {
        background: #e2e8f0;
        color: #0f172a;
      }
      #approve-btn {
        background: #dc2626;
        color: #ffffff;
      }
      [hidden] {
        display: none !important;
      }
      .small {
        font-size: 0.75rem;
      }
      #approval-error {
        margin-top: 8px;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Sentinel Scan</h1>
      <p class="hint">Scans run only through your self-hosted backend.</p>

      <p class="label">Current tab URL</p>
      <div id="current-url" class="url-box">Loading...</div>

      <button id="scan-btn" type="button" disabled>Scan this site</button>
      <p id="scan-status" class="muted">Detecting current site...</p>

      <div id="live-section" hidden>
        <div class="row"><span>Current node</span><strong id="current-node">-</strong></div>
        <div class="row"><span>Findings count</span><strong id="findings-count">0</strong></div>
      </div>

      <div id="summary-section" hidden>
        <p class="label">Findings by severity</p>
        <ul id="severity-summary" class="severity-list"></ul>
        <button id="report-btn" type="button" hidden>View full report</button>
      </div>

      <button id="open-options" type="button">Options</button>
    </div>

    <div id="approval-modal" class="modal-backdrop" hidden>
      <div class="modal">
        <h2>Human approval required</h2>
        <p id="approval-text">
          This scan wants to run active tests (sqlmap/ZAP active scan) against this target.
          Approve?
        </p>
        <div class="modal-actions">
          <button id="reject-btn" type="button">Reject</button>
          <button id="approve-btn" type="button">Approve</button>
        </div>
        <p id="approval-error" class="small" hidden></p>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
